name: Build Clone Maker (Windows)

# Builds tools/modding/clone_gui.py into a single MSSB-Clone-Maker.exe (no Python needed to run it).
# Download it from the run's "Artifacts" section; see tools/modding/README_GUI.md.

on:
  push:
    branches: [main]
    paths:
      - tools/modding/**
      - .github/workflows/build-gui.yml
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: python -m pip install --upgrade pip pyinstaller

    # The C codec (lzss.c): packing in seconds instead of minutes; MinGW gcc ships on windows-latest.
    # test_lzss.py checks it gives byte-identical output to the Python reference.
    - name: Build the C codec
      run: |
        gcc -O2 -shared -static-libgcc -o tools/modding/_lzss.dll tools/modding/lzss.c
        python tools/modding/test_lzss.py -v

    # The window itself, from source: builds every widget, then closes (no game file needed);
    # --expect-fonts fails if the bundled Rajdhani / Inter / JetBrains Mono did not load
    - name: Self-test (source)
      run: |
        python -m py_compile tools/modding/clone_character.py tools/modding/clone_gui.py tools/modding/gui_theme.py
        python tools/modding/clone_gui.py --selftest --expect-fonts --expect-fast-lzss

    - name: Build the .exe
      run: >
        pyinstaller --noconfirm --onefile --windowed --name MSSB-Clone-Maker
        --paths tools/modding --hidden-import gui_theme --add-data "tools/modding/fonts;fonts"
        --add-binary "tools/modding/_lzss.dll;."
        tools/modding/clone_gui.py

    # A --windowed exe detaches from the console, so wait for it and check its exit code
    - name: Self-test (.exe)
      shell: pwsh
      run: |
        $p = Start-Process -FilePath dist\MSSB-Clone-Maker.exe -ArgumentList '--selftest','--expect-fonts','--expect-fast-lzss','--log','selftest.log' -Wait -PassThru
        Get-Content selftest.log
        if ($p.ExitCode -ne 0) { throw "MSSB-Clone-Maker.exe --selftest exited with $($p.ExitCode)" }
        Get-Item dist\MSSB-Clone-Maker.exe | Format-List Name, Length

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MSSB-Clone-Maker
        path: dist/MSSB-Clone-Maker.exe
        if-no-files-found: error
